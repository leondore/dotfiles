# Mostly defaults: prefix stays C-b. Tuned for long-running agent sessions on VMs.

# Colours and terminal features (truecolor, Shift+Enter / modified keys for Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# Let OSC sequences (desktop notifications, hyperlinks) through to the outer terminal
set -g allow-passthrough on
set -g set-clipboard on

# Don't make Esc wait (neovim, Claude Code), pass focus events through
set -s escape-time 10
set -g focus-events on

set -g mouse on
set -g history-limit 50000

# Number windows/panes from 1 and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New panes/windows open in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
