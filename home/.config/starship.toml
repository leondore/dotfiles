# Inserts a blank line between shell prompts
add_newline = true

# Timeout for commands executed by starship (in milliseconds).
command_timeout = 10000

# Customizing the prompt
format = """
$username\
$hostname\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$package\
$cmake\
$cobol\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$helm\
$java\
$julia\
$kotlin\
$lua\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$pulumi\
$purescript\
$python\
$rlang\
$red\
$ruby\
$rust\
$scala\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$nix_shell\
$conda\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$env_var\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$shell\
[$character](bold green)"""

# Flags uncommitted changes in the dotfiles repo (tools like Claude Code write to
# the symlinked settings.json), so they don't sit unnoticed on a VM.
[custom.dotfiles]
description = 'Uncommitted changes in ~/.dotfiles'
when = 'git -C "${DOTFILES:-$HOME/.dotfiles}" status --porcelain 2>/dev/null | grep -q .'
command = 'git -C "${DOTFILES:-$HOME/.dotfiles}" status --porcelain | wc -l'
shell = ['sh']
symbol = '⚙ '
style = 'bold yellow'
format = '[$symbol$output]($style) '
